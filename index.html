<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flower Shop</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      h1 {
        text-align: center;
        /* color: white; */
        font-family: Georgia, "Times New Roman", Times, serif;
      }
      .image_Container {
        min-height: 100vh;
        min-width: 100vw;
        display: flex;
        justify-content: first baseline;
        align-items: center;
        flex-direction: column;
        background: linear-gradient(144deg, white, indigo);
        gap: 1.3rem;
        padding-top: 1.2rem;
      }
      img {
        height: 400px;
        /* height: 200px; */
        border: 2px solid white;
        border-radius: 10px;
        box-shadow: 2px 5px 30px rgb(28, 28, 28);
        transition: all 0.3s ease;
      }
      img:hover {
        transform: scale(1.02);
        box-shadow: 2px 5px 40px rgb(225, 224, 224);
      }
      h2 {
        font-family: cursive;
        background: linear-gradient(to left, rgba(255, 255, 255, 0.342), black);
        border-radius: 50px;
        color: white;
        font-size: 16px;
        box-shadow: -5px -5px 32px rgba(225, 224, 224, 0.3);
        padding: 8px;
        width: 120px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="image_Container">
      <h1>Image Changer Application</h1>
      <img src="./images/butterfly.jpg" alt="butterfly" />
      <h2>ButterFly</h2>
    </div>
    <script>
      let img = document.querySelector("img");
      let h2 = document.querySelector("h2");
      let prev_src = img.src;
      let prev_text = h2.innerText;

      img.addEventListener("mouseover", function () {
        img.src = "images/golden.jpg";
        img.style.transition = "all .3s ease ";
        h2.innerText = "Golden";
      });

      img.addEventListener("mouseleave", function () {
        img.src = prev_src;
        h2.innerText = prev_text;
      });
    </script>
  </body>
</html>
